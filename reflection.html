<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203529">
  <title>方塊光學實驗室｜反射定律</title>
  <style>
    :root {
      --forest: #203529;
      --forest-light: #32513a;
      --grass: #78ad50;
      --grass-dark: #3f733f;
      --paper: #f6f0dc;
      --ink: #263b35;
      --muted: #5c6d62;
      --orange: #e98936;
      --blue: #42a9be;
      --border: #233a2d;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: var(--forest);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .page {
      min-height: 100vh;
      padding: 22px clamp(18px, 3vw, 48px) 28px;
      background-color: var(--forest);
      background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .topbar, .content, .footer { max-width: 1440px; margin-inline: auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; color: white; }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand-mark {
      width: 48px; height: 48px; flex: none; background: var(--grass);
      border: 4px solid #a8d47d; box-shadow: 5px 5px 0 #101f16;
      position: relative;
    }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; background: #d3ed9c; width: 10px; height: 10px; }
    .brand-mark::before { left: 6px; top: 6px; }
    .brand-mark::after { right: 5px; bottom: 5px; background: #315f38; }
    .eyebrow { margin: 0 0 3px; font-size: 12px; font-weight: 900; letter-spacing: .16em; color: #b7d997; }
    h1 { margin: 0; font-size: clamp(21px, 2.5vw, 32px); line-height: 1.25; letter-spacing: .04em; }
    .chapter { display: inline-block; border: 2px solid #86ad6b; color: #d9eac8; padding: 8px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; text-decoration: none; }
    .chapter:hover { background: #32513a; }
    .chapter:focus-visible { outline: 3px solid #e98936; outline-offset: 3px; }
    .top-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

    .content { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .82fr); gap: 22px; align-items: stretch; }
    .panel { background: var(--paper); border: 5px solid var(--border); box-shadow: 8px 8px 0 #112118; }
    .stage-panel { overflow: hidden; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: #e6ddc0; border-bottom: 4px solid var(--border); }
    .panel-heading h2 { margin: 0; font-size: 16px; letter-spacing: .04em; }
    .live { display: inline-flex; align-items: center; gap: 7px; color: #38693c; font-weight: 900; font-size: 12px; white-space: nowrap; }
    .live::before { content: ""; width: 8px; height: 8px; background: #66a941; box-shadow: 2px 2px 0 #315a32; }
    .stage-wrap { padding: 14px 16px 0; }
    #diagram { display: block; width: 100%; height: auto; aspect-ratio: 800 / 500; touch-action: none; user-select: none; }
    .stage-hint { display: flex; gap: 12px; align-items: center; padding: 12px 20px 18px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .hint-square { width: 12px; height: 12px; flex: none; background: var(--grass); box-shadow: 3px 3px 0 #436c3a; }

    .control-panel { display: flex; flex-direction: column; padding: 22px; gap: 18px; }
    .section-label { margin: 0; color: var(--grass-dark); font-size: 12px; font-weight: 900; letter-spacing: .12em; }
    .control-panel h2 { margin: 4px 0 0; font-size: 23px; line-height: 1.35; }
    .intro { margin: 0; line-height: 1.65; font-size: 14px; color: var(--muted); }
    .angle-card { padding: 16px; background: #fffaf0; border: 3px solid var(--border); box-shadow: 4px 4px 0 #c6bda6; }
    .angle-card label { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-weight: 900; }
    .angle-card strong { color: #a54e19; font-size: 28px; font-variant-numeric: tabular-nums; }
    #angle-slider { width: 100%; margin: 16px 0 8px; accent-color: var(--grass-dark); height: 34px; cursor: pointer; }
    .range-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 800; }
    .readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .readout { padding: 14px 12px; border: 3px solid var(--border); background: #f6e0bb; }
    .readout.reflection { background: #d1ebea; }
    .readout .name { display: block; font-size: 13px; font-weight: 900; }
    .readout .value { display: block; margin-top: 6px; font-size: clamp(23px, 3vw, 32px); font-weight: 900; font-variant-numeric: tabular-nums; }
    .readout.incidence .value { color: #a9561e; }
    .readout.reflection .value { color: #23798d; }
    .law { padding: 16px; border-left: 6px solid var(--grass-dark); background: #e4ebce; }
    .law-title { margin: 0 0 6px; font-weight: 900; font-size: 14px; }
    .law p:last-child { margin: 0; line-height: 1.55; font-size: 14px; }
    .actions { margin-top: auto; display: flex; gap: 10px; }
    .reset { width: 100%; min-height: 46px; border: 3px solid #1c3729; background: var(--grass); color: #15301e; font-weight: 900; box-shadow: 4px 4px 0 #1c3729; }
    .reset:hover { background: #8cc667; }
    .reset:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1c3729; }
    .reset:focus-visible, #angle-slider:focus-visible { outline: 3px solid #ec8d3d; outline-offset: 3px; }
    .footer { display: flex; justify-content: space-between; gap: 18px; margin-top: 22px; color: #c3d8bf; font-size: 12px; }
    .footer p { margin: 0; }

    .ray { stroke-width: 7; stroke-linecap: square; }
    .ray-hit { fill: none; stroke: transparent; stroke-width: 32; cursor: grab; }
    .ray-hit:active, #drag-handle:active { cursor: grabbing; }
    #drag-handle { cursor: grab; }
    .svg-label { font-size: 18px; font-weight: 900; fill: #263b35; paint-order: stroke; stroke: #fffaf0; stroke-width: 5px; stroke-linejoin: round; }
    .angle-label { font-size: 21px; font-weight: 900; paint-order: stroke; stroke: #fffaf0; stroke-width: 6px; stroke-linejoin: round; }


    @media (max-width: 980px) {
      .content { grid-template-columns: 1fr; }
      .control-panel { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      .control-panel > :first-child, .control-panel > .intro, .control-panel > .law, .control-panel > .actions { grid-column: 1 / -1; }
      .actions { margin-top: 0; }
    }
    @media (max-width: 620px) {
      .page { padding: 14px 12px 24px; }
      .topbar { flex-wrap: wrap; }
      .chapter { margin-left: auto; }
      .chapter { padding: 7px 8px; font-size: 11px; }
      .panel { box-shadow: 5px 5px 0 #112118; }
      .panel-heading { padding: 12px; }
      .stage-wrap { padding: 4px; }
      .stage-hint { padding: 8px 12px 14px; }
      .control-panel { display: flex; padding: 15px; }
      .footer { flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">BLOCK OPTICS LAB</p>
          <h1>方塊光學實驗室</h1>
        </div>
      </div>
      <nav class="top-links" aria-label="頁面導覽">
        <a class="chapter" href="index.html">← 返回入口</a>
        <a class="chapter" href="reflection-quiz.html">進入小測驗 →</a>
      </nav>
    </header>

    <div class="content">
      <section class="panel stage-panel" aria-labelledby="stage-title">
        <div class="panel-heading">
          <h2 id="stage-title">平面鏡反射實驗</h2>
          <span class="live">即時模擬</span>
        </div>
        <div class="stage-wrap">
          <svg id="diagram" viewBox="0 0 800 500" role="img" aria-labelledby="diagram-title diagram-desc">
            <title id="diagram-title">平面鏡反射示意圖</title>
            <desc id="diagram-desc">橙色入射線由左側射向平面鏡，藍色反射線向右側離開。可拖動橙色方塊改變入射角。</desc>
            <defs>
              <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d7ddca" stroke-width="1"/>
              </pattern>
            </defs>
            <rect width="800" height="500" fill="#f9f5e7"/>
            <rect width="800" height="500" fill="url(#grid)"/>
            <g aria-hidden="true">
              <path d="M60 68h22v-18h48v18h24v18H60z" fill="#e9ebd8"/>
              <path d="M638 86h25V65h59v21h28v18H638z" fill="#e9ebd8"/>
              <rect x="105" y="124" width="13" height="13" fill="#d9e5c8"/>
              <rect x="680" y="170" width="10" height="10" fill="#d9e5c8"/>
            </g>
            <line x1="400" y1="75" x2="400" y2="350" stroke="#627d73" stroke-width="4" stroke-dasharray="12 9"/>
            <text x="414" y="112" class="svg-label">法線</text>
            <g aria-hidden="true">
              <rect x="60" y="354" width="680" height="53" fill="#7aa4ab" stroke="#244e57" stroke-width="5"/>
              <rect x="60" y="354" width="680" height="12" fill="#b4e3e4"/>
              <path d="M82 407l-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27m66-27-20 27" stroke="#244e57" stroke-width="5"/>
            </g>
            <text x="400" y="468" text-anchor="middle" class="svg-label">平面鏡</text>
            <path id="incident-arc" fill="none" stroke="#e98936" stroke-width="4"/>
            <path id="reflection-arc" fill="none" stroke="#42a9be" stroke-width="4"/>
            <line id="incident-ray" class="ray" stroke="#e98936"/>
            <line id="reflection-ray" class="ray" stroke="#42a9be"/>
            <path id="incident-direction" d="M20 0 L-2 -13 -2 -6 -21 -6 -21 6 -2 6 -2 13Z" fill="#e98936" stroke="#743b1c" stroke-width="3" stroke-linejoin="miter" pointer-events="none"/>
            <path id="reflection-direction" d="M20 0 L-2 -13 -2 -6 -21 -6 -21 6 -2 6 -2 13Z" fill="#42a9be" stroke="#205a68" stroke-width="3" stroke-linejoin="miter" pointer-events="none"/>
            <line id="incident-hit" class="ray-hit"/>
            <circle cx="400" cy="350" r="8" fill="#213c35" stroke="#fffaf0" stroke-width="3"/>
            <text id="incident-angle-label" class="angle-label" fill="#ad571c" text-anchor="middle"></text>
            <text id="reflection-angle-label" class="angle-label" fill="#23798d" text-anchor="middle"></text>
            <text id="incident-name" class="svg-label" text-anchor="middle">入射線</text>
            <text id="reflection-name" class="svg-label" text-anchor="middle">反射線</text>
            <g id="drag-handle" aria-hidden="true">
              <rect x="-17" y="-17" width="34" height="34" fill="#e98936" stroke="#743b1c" stroke-width="4"/>
              <rect x="-7" y="-7" width="14" height="14" fill="#fff4d2"/>
              <rect x="-28" y="-28" width="56" height="56" fill="transparent"/>
            </g>
          </svg>
        </div>
        <div class="stage-hint"><span class="hint-square" aria-hidden="true"></span><span>拖動橙色方塊，或使用右側滑桿，觀察光線如何改變。</span></div>
      </section>

      <aside class="panel control-panel" aria-labelledby="control-title">
        <div>
          <p class="section-label">實驗控制台</p>
          <h2 id="control-title">改變入射角</h2>
        </div>
        <p class="intro">角度由光線與法線之間量度。移動光線，看看反射角會怎樣改變。</p>
        <div class="angle-card">
          <label for="angle-slider"><span>入射角</span><strong id="slider-value">30°</strong></label>
          <input id="angle-slider" type="range" min="0" max="90" step="1" value="30" aria-describedby="range-help">
          <div class="range-ends" id="range-help"><span>0° ／ 垂直入射</span><span>90° ／ 沿鏡面</span></div>
        </div>
        <div class="readouts" aria-live="polite">
          <div class="readout incidence"><span class="name">入射角</span><span class="value" id="incident-value">30°</span></div>
          <div class="readout reflection"><span class="name">反射角</span><span class="value" id="reflection-value">30°</span></div>
        </div>
        <div class="law">
          <p class="law-title">觀察所得：反射定律</p>
          <p>入射角 ＝ 反射角。兩個角度都以法線為準。</p>
        </div>
        <div class="actions"><button class="reset" type="button" id="reset-button">重設至 30°</button></div>
      </aside>
    </div>
    <footer class="footer"><p>方塊光學實驗室 · 光的反射</p><p>試試 0°、30°、60° 和 90°，比較兩個角度。</p></footer>
  </main>

  <script>
    const diagram = document.querySelector('#diagram');
    const slider = document.querySelector('#angle-slider');
    const handle = document.querySelector('#drag-handle');
    const hitLine = document.querySelector('#incident-hit');
    const point = { x: 400, y: 350 };
    const rayLength = 240;
    let dragging = false;

    function setLine(id, x1, y1, x2, y2) {
      const line = document.querySelector(id);
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
    }

    function render(angle) {
      const radians = angle * Math.PI / 180;
      const sine = Math.sin(radians);
      const cosine = Math.cos(radians);
      const startX = point.x - rayLength * sine;
      const startY = point.y - rayLength * cosine;
      const endX = point.x + rayLength * sine;
      const endY = point.y - rayLength * cosine;
      const reflectionLength = angle === 0 ? 165 : rayLength;
      const reflectX = point.x + reflectionLength * sine;
      const reflectY = point.y - reflectionLength * cosine;

      setLine('#incident-ray', startX, startY, point.x, point.y);
      setLine('#reflection-ray', point.x, point.y, reflectX, reflectY);
      setLine('#incident-hit', startX, startY, point.x, point.y);
      document.querySelector('#incident-direction').setAttribute('transform',
        `translate(${startX + (point.x - startX) * 0.22} ${startY + (point.y - startY) * 0.22}) rotate(${90 - angle})`);
      document.querySelector('#reflection-direction').setAttribute('transform',
        `translate(${point.x + (reflectX - point.x) * 0.48} ${point.y + (reflectY - point.y) * 0.48}) rotate(${angle - 90})`);
      handle.setAttribute('transform', `translate(${startX} ${startY})`);

      const radius = 55;
      const leftX = point.x - radius * sine;
      const rightX = point.x + radius * sine;
      const arcY = point.y - radius * cosine;
      document.querySelector('#incident-arc').setAttribute('d', angle === 0 ? '' : `M 400 295 A 55 55 0 0 0 ${leftX} ${arcY}`);
      document.querySelector('#reflection-arc').setAttribute('d', angle === 0 ? '' : `M 400 295 A 55 55 0 0 1 ${rightX} ${arcY}`);

      const labelOffset = 73 + 35 * Math.sin(radians / 2);
      const labelY = point.y - 91 * Math.cos(radians / 2) - 12;
      const incidentLabel = document.querySelector('#incident-angle-label');
      const reflectionLabel = document.querySelector('#reflection-angle-label');
      incidentLabel.setAttribute('x', point.x - labelOffset);
      incidentLabel.setAttribute('y', labelY);
      reflectionLabel.setAttribute('x', point.x + labelOffset);
      reflectionLabel.setAttribute('y', labelY);
      incidentLabel.textContent = `${angle}°`;
      reflectionLabel.textContent = `${angle}°`;

      const incidenceName = document.querySelector('#incident-name');
      const reflectionName = document.querySelector('#reflection-name');
      incidenceName.setAttribute('x', angle === 0 ? 315 : Math.max(116, startX - 35));
      incidenceName.setAttribute('y', angle === 90 ? 314 : Math.max(66, startY - 24));
      reflectionName.setAttribute('x', angle === 0 ? 485 : Math.min(684, endX + 38));
      reflectionName.setAttribute('y', angle === 90 ? 314 : Math.max(66, endY - 24));

      slider.value = angle;
      for (const id of ['#slider-value', '#incident-value', '#reflection-value']) {
        document.querySelector(id).textContent = `${angle}°`;
      }
    }

    function angleFromPointer(event) {
      const bounds = diagram.getBoundingClientRect();
      const x = (event.clientX - bounds.left) * 800 / bounds.width;
      const y = (event.clientY - bounds.top) * 500 / bounds.height;
      const angle = Math.atan2(Math.max(0, point.x - x), Math.max(0, point.y - y)) * 180 / Math.PI;
      return Math.max(0, Math.min(90, Math.round(angle)));
    }

    function beginDrag(event) {
      dragging = true;
      diagram.setPointerCapture(event.pointerId);
      render(angleFromPointer(event));
    }

    handle.addEventListener('pointerdown', beginDrag);
    hitLine.addEventListener('pointerdown', beginDrag);
    diagram.addEventListener('pointermove', event => {
      if (dragging) render(angleFromPointer(event));
    });
    diagram.addEventListener('pointerup', () => { dragging = false; });
    diagram.addEventListener('pointercancel', () => { dragging = false; });
    slider.addEventListener('input', () => render(Number(slider.value)));
    document.querySelector('#reset-button').addEventListener('click', () => render(30));
    render(30);
  </script>
</body>
</html>
