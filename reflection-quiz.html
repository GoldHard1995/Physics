<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203529">
  <title>光的反射小測驗｜方塊光學實驗室</title>
  <link rel="stylesheet" href="quiz.css">
</head>
<body>
  <main class="page">
    <header class="topbar quiz-page">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">BLOCK OPTICS LAB</p>
          <h1>光的反射小測驗</h1>
        </div>
      </div>
      <nav class="top-links" aria-label="頁面導覽">
        <a class="chapter" href="reflection.html">← 返回模擬器</a>
        <a class="chapter" href="index.html">入口</a>
      </nav>
    </header>

    <section class="panel quiz-panel quiz-page" aria-labelledby="quiz-title">
      <div class="panel-heading quiz-heading">
        <h2 id="quiz-title">反射定律 ／ 小測驗</h2>
        <div class="quiz-progress" id="quiz-progress" aria-live="polite"></div>
      </div>
      <div class="quiz-inner">
        <p class="quiz-number" id="quiz-number"></p>
        <h3 id="question-title"></h3>
        <p class="quiz-prompt" id="question-prompt"></p>
        <div class="quiz-layout">
          <div class="quiz-visual" id="quiz-visual"></div>
          <div class="quiz-response">
            <div id="quiz-answer"></div>
            <p class="quiz-feedback" id="quiz-feedback" role="status" aria-live="polite">完成後按「檢查答案」。</p>
            <div class="quiz-buttons">
              <button class="quiz-button" type="button" id="quiz-check">檢查答案</button>
              <button class="quiz-button secondary" type="button" id="quiz-next" hidden>下一題</button>
              <button class="quiz-button secondary" type="button" id="quiz-restart" hidden>再玩一次</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <footer class="footer quiz-page"><p>方塊光學實驗室 · 光的反射</p><p>記住：法線與鏡面成 90°；入射角等於反射角。</p></footer>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
